<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>AI ClipCatcher</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                width: 320px;
                margin: 0;
            }
            .max-w-sm {
                max-width: 24rem;
            }
            .mx-auto {
                margin-left: auto;
                margin-right: auto;
            }
            .bg-white {
                background-color: #fff;
            }
            .overflow-hidden {
                overflow: hidden;
            }
            .px-6 {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
            .py-4 {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }
            .mb-2 {
                margin-bottom: 0.5rem;
            }
            .mb-4 {
                margin-bottom: 1rem;
            }
            .text-xl {
                font-size: 1.25rem;
            }
            .font-bold {
                font-weight: 700;
            }
            .text-gray-700 {
                color: #4a5568;
            }
            .text-base {
                font-size: 1rem;
            }
            .block {
                display: block;
            }
            .text-sm {
                font-size: 0.875rem;
            }
            .shadow {
                box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            }
            .appearance-none {
                appearance: none;
            }
            .border {
                border: 1px solid #e2e8f0;
            }
            .rounded {
                border-radius: 0.25rem;
            }
            .w-full {
                width: 100%;
            }
            .py-2 {
                padding-top: 0.5rem;
                padding-bottom: 0.5rem;
            }
            .px-3 {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
            .px-4 {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .leading-tight {
                line-height: 1.25;
            }
            .focus\\:outline-none:focus {
                outline: 0;
            }
            .focus\\:shadow-outline:focus {
                box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
            }
            .text-xs {
                font-size: 0.75rem;
            }
            .text-gray-500 {
                color: #a0aec0;
            }
            .mt-1 {
                margin-top: 0.25rem;
            }
            .bg-blue-500 {
                background-color: #4299e1;
            }
            .hover\\:bg-blue-700:hover {
                background-color: #2b6cb0;
            }
            .text-white {
                color: #fff;
            }
            input,
            button {
                width: 100%;
                box-sizing: border-box;
            }
            button {
                cursor: pointer;
                border: none;
            }
            button:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }
        </style>
    </head>
    <body>
        <!-- design a simple card -->
        <div class="max-w-sm mx-auto bg-white overflow-hidden">
            <div class="px-6 py-4">
                <h2 class="text-xl font-bold mb-2">AI ClipCatcher Settings</h2>
                <p class="text-gray-700 text-base mb-4">Configure your download preferences</p>

                <div class="mb-4">
                    <label for="downloadPath" class="block text-gray-700 text-sm font-bold mb-2">
                        Download Folder Path:
                    </label>
                    <input
                        type="text"
                        id="downloadPath"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        placeholder="ai-video" />
                    <p class="text-xs text-gray-500 mt-1">
                        This will create a subfolder in your default downloads directory.
                        <br />You cannot specify an absolute path (e.g., "/Users/Downloads/ai-video") due to browser
                        restrictions.
                    </p>
                </div>

                <button
                    id="saveSettings"
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Save Settings
                </button>
            </div>
        </div>
        <script src="./popup.js"></script>
    </body>
</html>
