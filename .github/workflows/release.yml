name: Create Release

on:
    push:
        tags:
            - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

# Explicitly define permissions needed for creating releases
permissions:
    contents: write
    packages: write

jobs:
    build:
        name: Create Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '16'

            - name: Extract version from tag
              id: get_version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Update version in manifest
              run: |
                  # Update version in manifest.json
                  sed -i 's/"version": ".*"/"version": "${{ steps.get_version.outputs.VERSION }}"/' manifest.json
                  cat manifest.json

            - name: Package Extension
              run: |
                  # Create a clean zip excluding development files
                  mkdir -p dist
                  zip -r dist/ai-clipcatcher-${{ steps.get_version.outputs.VERSION }}.zip \
                    manifest.json \
                    background.js \
                    script.js \
                    popup.js \
                    index.html \
                    icons/ \
                    -x "*.git*" -x "*.github*" -x "*.vscode*" -x "dist/*"
                  ls -la dist/

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      dist/ai-clipcatcher-${{ steps.get_version.outputs.VERSION }}.zip
                  name: AI ClipCatcher v${{ steps.get_version.outputs.VERSION }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
