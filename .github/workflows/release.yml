name: Create Release

on:
    push:
        tags:
            - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
    build:
        name: Create Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Build project
              run: |
                  # Add any build steps here if needed
                  # For example, zip the extension files for release
                  zip -r ai-clipcatcher.zip . -x "*.git*" -x "*.github*"

            - name: Extract tag name
              id: get_tag
              run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

            - name: Extract version from tag
              id: get_version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

            - name: Update version in manifest
              run: |
                  # Update version in manifest.json
                  sed -i 's/"version": ".*"/"version": "${{ env.VERSION }}"/' manifest.json

            - name: Package Extension
              run: |
                  # Create a clean zip excluding development files
                  mkdir -p dist
                  zip -r dist/ai-clipcatcher-${{ env.VERSION }}.zip \
                    manifest.json \
                    background.js \
                    script.js \
                    popup.js \
                    index.html \
                    icons/ \
                    -x "*.git*" -x "*.github*" -x "*.vscode*" -x "dist/*"

            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      dist/ai-clipcatcher-${{ env.VERSION }}.zip
                  name: AI ClipCatcher v${{ env.VERSION }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
