name: Create Release

on:
    push:
        tags:
            - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

# Explicitly define permissions needed for creating releases
permissions:
    contents: write
    packages: write

jobs:
    build:
        name: Create Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '16'

            - name: Extract version from tag
              id: get_version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Update version in manifest
              run: |
                  # Update version in manifest.json
                  sed -i 's/"version": ".*"/"version": "${{ steps.get_version.outputs.VERSION }}"/' manifest.json
                  cat manifest.json

            - name: Package Extension
              run: |
                  # Create a clean zip excluding development files
                  mkdir -p dist
                  zip -r dist/ai-clipcatcher-${{ steps.get_version.outputs.VERSION }}.zip \
                    manifest.json \
                    background.js \
                    script.js \
                    popup.js \
                    index.html \
                    icons/ \
                    -x "*.git*" -x "*.github*" -x "*.vscode*" -x "dist/*"
                  ls -la dist/

            - name: Generate Full Changelog
              id: generate_changelog
              run: |
                  # Get the previous tag for comparison
                  git fetch --tags
                  PREV_TAG=$(git tag --sort=-v:refname | grep "^v" | head -n 2 | tail -n 1)

                  if [ -z "$PREV_TAG" ]; then
                    # If there's no previous tag, get the first commit
                    echo "CHANGELOG=## 🚀 First Release v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
                  else
                    # Generate changelog since the previous tag
                    echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
                    echo "## 🚀 Changes since $PREV_TAG" >> $GITHUB_OUTPUT
                    echo "" >> $GITHUB_OUTPUT
                    
                    # Group by type using conventional commits pattern
                    # New Features
                    FEATURES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --grep="^feat")
                    if [ ! -z "$FEATURES" ]; then
                      echo "### ✨ New Features" >> $GITHUB_OUTPUT
                      echo "$FEATURES" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                    fi
                    
                    # Bug Fixes
                    FIXES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --grep="^fix")
                    if [ ! -z "$FIXES" ]; then
                      echo "### 🐛 Bug Fixes" >> $GITHUB_OUTPUT
                      echo "$FIXES" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                    fi
                    
                    # Documentation
                    DOCS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --grep="^docs")
                    if [ ! -z "$DOCS" ]; then
                      echo "### 📝 Documentation" >> $GITHUB_OUTPUT
                      echo "$DOCS" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                    fi
                    
                    # Other Changes
                    OTHER=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --grep="^refactor\|^chore\|^style\|^test\|^perf")
                    if [ ! -z "$OTHER" ]; then
                      echo "### 🧹 Other Changes" >> $GITHUB_OUTPUT
                      echo "$OTHER" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                      echo "" >> $GITHUB_OUTPUT
                    fi
                    
                    # Full Change Log (always show this section)
                    echo "### 📦 Full Change Log" >> $GITHUB_OUTPUT
                    git log "$PREV_TAG"..HEAD --pretty=format:"- %h %s" | grep -v "^- [a-f0-9]* Merge " >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      dist/ai-clipcatcher-${{ steps.get_version.outputs.VERSION }}.zip
                  name: AI ClipCatcher v${{ steps.get_version.outputs.VERSION }}
                  body: ${{ steps.generate_changelog.outputs.CHANGELOG }}
                  draft: false
                  prerelease: false
                  generate_release_notes: false
